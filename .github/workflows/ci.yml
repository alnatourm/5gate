name: OGroup AI Factory CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify Node.js and built-in node:sqlite support
        run: |
          node -v
          npm -v
          node -e "const sqlite = require('node:sqlite'); if (!sqlite || !sqlite.DatabaseSync) { throw new Error('node:sqlite DatabaseSync unavailable'); }"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript validation (tsc --noEmit)
        run: npm run lint

      - name: Run automated Gate 1 test suite
        run: npm test

      - name: Production build
        run: npm run build
